<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E6F1FB">
<title>Planora · Offline</title>
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #E6F1FB 0%, #EEEDFE 100%);
    color: #26215C; display: flex; align-items: center; justify-content: center;
    padding: 24px env(safe-area-inset-right) 24px env(safe-area-inset-left); box-sizing: border-box; text-align: center;
  }
  .box { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 18px 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #555; margin: 0 0 22px; }
  button {
    font: inherit; font-size: 16px; border: 0; border-radius: 14px; padding: 13px 22px; min-height: 48px;
    background: #7F77DD; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>This page hasn't been opened on this device yet, so it isn't saved. Anything you already added is safe and will sync when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
